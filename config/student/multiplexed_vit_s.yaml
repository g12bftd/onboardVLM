# MiniViT-style: 4 stored blocks x 3 steps = 12 effective layers.
# NOTE: head_mix costs ~num_heads x the attention-value FLOPs; see multiplexed_vit_s_lowrank.
name: multiplexed_vit
out_dim: ${deploy_vision_dim}
embed_dim: 384
num_heads: 6
mlp_ratio: 4.0
num_shared_blocks: 4
steps_per_block: 3
step_transform: minivit   # head_mix + dwconv
drop_path: 0.1
input_norm: gemma
