# logit_distillation on HUMAN reference answers of the benchmark TRAIN splits (ablation; the main protocol
# distils on teacher-generated responses: data_module=teacher_responses).
_target_: onboard_vlm.data.data_module.DistillDataModule
train:
  - {name: lmdb_vqa, path: "${data_root}/vizwiz", split: train, mode: vqa}
  - {name: lmdb_vqa, path: "${data_root}/textvqa", split: train, mode: vqa}
val:
  - {name: lmdb_vqa, path: "${data_root}/vizwiz", split: val, mode: vqa, limit: 500, group: vizwiz}
input_domain: ${input_domain}
sampling: {mode: full, budgets: "${train_budgets}", budget_weights: "${train_budget_weights}", tokens_per_batch: "${tokens_per_batch}"}
evaluation: {val_budgets: "${val_budgets}", test_budgets: "${test_budgets}", tokens_per_batch: "${tokens_per_batch}"}
collator: {train: false, build_student_view: false}
text: {processor_id: "${teacher.model_id}", revision: "${teacher.revision}", prompt: auto, with_answer: true}
num_workers: ${num_workers}
seed: ${seed}
