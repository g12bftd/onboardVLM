# Small, quick: images of the benchmark TRAIN splits only (VizWiz, TextVQA, EgoBlind; ~45K images).
_target_: onboard_vlm.data.data_module.DistillDataModule
train:
  - {name: lmdb_vqa, path: "${data_root}/vizwiz", split: train, mode: image}
  - {name: lmdb_vqa, path: "${data_root}/textvqa", split: train, mode: image}
  - {name: lmdb_vqa, path: "${data_root}/egoblind", split: train, mode: image, video_frames: all}
val:
  - {name: lmdb_vqa, path: "${data_root}/vizwiz", split: val, mode: image, limit: 1000}
collator: {token_budgets: "${token_budgets}", train: true, crop_scale: [0.5, 1.0], crop_ratio: [0.75, 1.3333], hflip_prob: 0.0}
val_collator: {token_budgets: [280], train: false}
batch_size: ${batch_size}
num_workers: ${num_workers}
seed: ${seed}
