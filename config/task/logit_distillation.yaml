# @package _global_
# Distillation type 3: graft the student into the original Gemma 4 VLM and match next-token logits of
# the original VLM on teacher-forced VQA answers. Only the student is trained by default.
task:
  _target_: onboard_vlm.tasks.logit_distillation.LogitDistillationTask
  _recursive_: false
  student_dir: ${student_dir}      # export of a feature / embedding run (null = fresh student from config)
  logit_teacher_id: null           # null = same VLM with its original vision tower
  train_student: true
  train_embed_vision: none         # none | lora | full (ablations; these change the VLM)
  lora_rank: 16
  lora_alpha: 32.0
  gradient_checkpointing: true
  dtype: bfloat16
  optimizer: {lr: 1.0e-4, weight_decay: 0.0, betas: [0.9, 0.999]}
  scheduler: {warmup_ratio: 0.03, min_lr_ratio: 0.1}
