# Original Gemma 4 E2B instruction-tuned (default deployment VLM), loaded with Gemma4ForConditionalGeneration.from_pretrained.
# The vision tower is identical in E2B / E4B / base / -it; the choice selects embed_vision (embedding
# distillation: 1536-d for E2B, 2560-d for E4B) and the VLM used by logit distillation and evaluation.
name: gemma4
model_id: google/gemma-4-E2B-it
revision: 4adf15748de9e1a0097b6274cee9c15836c41c37   # pinned commit for reproducibility ("main" = latest)
load: vision             # set by the task: vision (feature / embedding) | vlm (logit)
dtype: bfloat16          # checkpoint dtype
attn_implementation: sdpa
