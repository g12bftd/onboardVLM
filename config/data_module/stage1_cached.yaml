# Stage-1 from an offline teacher cache (run_cache_teacher.py); the teacher is never run.
_target_: onboard_vlm.data.data_module.DistillDataModule
train:
  - name: cached_teacher
    cache_root: ${cache_root}
    layers: null          # null = every cached layer (must cover the teacher side of layer_map)
    random_view: true
    base: {name: lmdb_vqa, path: "${data_root}/vizwiz", split: train, mode: image}
val: null
collator: {token_budgets: "${token_budgets}", train: false, build_teacher_inputs: false}
batch_size: ${batch_size}
num_workers: ${num_workers}
seed: ${seed}
