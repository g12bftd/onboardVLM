# @package _global_
# python -u run_distill.py +experiment=stage1/timm_efficientvit_b1_e2b
experiment_name: stage1_timm_efficientvit_b1_e2b
token_budgets: [140, 280, 560]   # multi-budget training; the student is budget-agnostic
batch_size: 32
layer_map: {2: 7, 3: 15}                 # student layer/stage -> Gemma 4 E2B vision layer (0..15)
defaults:
  - override /teacher: gemma4_e2b
  - override /student: timm_efficientvit_b1
  - override /criterion: stage1_full
  - override /data_module: stage1_mix
trainer:
  max_epochs: 30
