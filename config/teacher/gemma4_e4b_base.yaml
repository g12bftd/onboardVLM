# Original Gemma 4 E4B pretrained (base), loaded with Gemma4ForConditionalGeneration.from_pretrained.
# The vision tower is identical in E2B / E4B / base / -it; the choice selects embed_vision (embedding
# distillation: 1536-d for E2B, 2560-d for E4B) and the VLM used by logit distillation and evaluation.
name: gemma4
model_id: google/gemma-4-E4B
revision: 11b8250ef59eb3ebc5dae7b21144d7b84f2c06dd   # pinned commit for reproducibility ("main" = latest)
load: vision             # set by the task: vision (feature / embedding) | vlm (logit)
dtype: bfloat16          # checkpoint dtype
attn_implementation: sdpa
