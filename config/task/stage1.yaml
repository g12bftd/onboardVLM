_target_: onboard_vlm.distill.tasks.Stage1FeatureDistillTask
_recursive_: false
student: ${student}
teacher: ${teacher}
criterion: ${criterion}
layer_map: ${layer_map}
adapter: {kind: linear, force_final: false, force_layers: false}
cache_root: ${cache_root}
optimizer: {lr: 1.0e-3, weight_decay: 0.05, betas: [0.9, 0.999]}
scheduler: {warmup_ratio: 0.05, min_lr_ratio: 0.01}
