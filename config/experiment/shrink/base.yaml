# @package _global_
# Shrinking study (docs/shrink_study.md): the Gemma 4 vision encoder made smaller (fewer layers, narrower), measured
# over training time. Recipe = the input / objective config groups (defaults: the simplest recipe of docs/methods.md,
# full images at 280 tokens and one MSE term); run the size axis with the recipe the ladder selected:
#   python -u run_distill.py +experiment=shrink/base student.num_hidden_layers=8 student.hidden_size=384 seed=0
#   ... input=crop objective=fm_fmL   (part of the run name)
experiment_name: shrink_${teacher.key}_${input_name}_${objective_name}_lr${task.optimizer.lr}_L${student.num_hidden_layers}_D${student.hidden_size}_${student.init}_${student.layer_selection}-${student.width_selection}
validate_at_start: true         # step 0 of every learning curve
defaults:
  - /input: full280
  - /objective: mse
  - override /task: embedding_distillation
  - override /criterion: embedding_tokens
  - override /teacher: gemma4_e2b
  - override /student: gemma4_shrink
  - override /data_module: general_vision_lite
task:
  optimizer: {weight_decay: 0.0}   # AdamW's decay pulls inherited teacher weights towards 0 even at zero loss: off in the simplest recipe
trainer:
  max_epochs: 10                # 10 x 500k = 5M image samples per run (equal for every run of the study)
  val_check_interval: 0.5       # 20 validation points + step 0
callbacks:
  trajectory:                   # student exports at fixed fractions of training -> scripts/trajectory_eval.py
    _target_: onboard_vlm.utils.callbacks.TrajectoryCallback
    dirpath: ${output_root}/trajectories/${run_id}
