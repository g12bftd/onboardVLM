accelerator: gpu
devices: -1
num_nodes: ${num_nodes}
strategy: ddp
precision: bf16-mixed
max_epochs: 30
gradient_clip_val: 1.0
accumulate_grad_batches: 1
log_every_n_steps: 20
check_val_every_n_epoch: 1
num_sanity_val_steps: 2
use_distributed_sampler: false   # our batch samplers shard across ranks themselves (shape-exact batches)
