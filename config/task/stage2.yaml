_target_: onboard_vlm.distill.tasks.Stage2GraftedKDTask
_recursive_: false
vlm_id: ${teacher.model_id}           # deployment VLM (vision width == student out_dim)
student_dir: ${output_root}/students/${stage1_experiment}
logit_teacher_id: null                # null = same VLM with its original vision tower
train_embed_vision: full              # full | lora | none
lora_rank: 16
lora_alpha: 32.0
train_student: false
criterion: ${criterion}
optimizer: {lr: 1.0e-4, weight_decay: 0.0, betas: [0.9, 0.999]}
scheduler: {warmup_ratio: 0.03, min_lr_ratio: 0.1}
dtype: bfloat16
gradient_checkpointing: true
