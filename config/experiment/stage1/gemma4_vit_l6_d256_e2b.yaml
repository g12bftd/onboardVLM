# @package _global_
# python -u run_distill.py +experiment=stage1/gemma4_vit_l6_d256_e2b
experiment_name: stage1_gemma4_vit_l6_d256_e2b
token_budgets: [140, 280, 560]   # multi-budget training; the student is budget-agnostic
batch_size: 32
layer_map: {1: 3, 3: 9}   # student layer/stage -> Gemma 4 vision layer (0..15); uniform selection keeps [0, 3, 6, 9, 12, 15]
defaults:
  - override /teacher: gemma4_e2b
  - override /student: gemma4_vit_l6_d256
  - override /criterion: stage1_full_lm
  - override /data_module: stage1_general
trainer:
  max_epochs: 30
