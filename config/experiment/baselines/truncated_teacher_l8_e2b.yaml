# @package _global_
# Baseline: initialise the student with the teacher's first 8 layers, then embedding-distil with the same
# data, budget mix and compute as the main students (python -u run_distill.py +experiment=baselines/truncated_teacher_l8_e2b).
experiment_name: baseline_truncated_teacher_l8_e2b
defaults:
  - override /task: embedding_distillation
  - override /criterion: embedding_tokens
  - override /teacher: gemma4_e2b
  - override /student: gemma4_truncated_l8
  - override /data_module: general_vision
