#   python -u run_distill.py -m +experiment=sweeps/corpus_mixture
experiment_name: sweep_corpus_drop_${join:${data_module.drop_groups},_}
defaults:
  - override /teacher: gemma4_e2b
  - override /student: gemma4_vit_l8_d384
  - override /data_module: general_vision_lite
hydra:
  sweeper:
    params:
      data_module.drop_groups: "[],[web],[objects],[scenes],[text_rich],[egocentric],[target]"
