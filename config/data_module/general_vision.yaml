# OVLM-GV: general-vision distillation corpus (docs/corpus.md; build with make_datasets/build_corpus.sh).
# Every source is its own LMDB dataset under ${corpus_root}/<source>. Nothing experiment-specific is
# stored in those files: the mixture weights, the groups and the train / val / test split all live here.
#
#   one component off          data_module.mixture.ego4d=0
#   one group off              data_module.drop_groups=[egocentric]       (sweep: +experiment=sweeps/corpus_mixture)
#   different weights          data_module.mixture.cc12m=0.4 data_module.mixture.objects=0.05
#   ImageNet-21k as objects    objects_source=imagenet21k data_module.mixture.objects=0.20 data_module.mixture.cc12m=0.25
#   bigger / other val split   corpus_split.val_fraction=0.005
#   re-drawn splits            corpus_split.split_seed=1
_target_: onboard_vlm.data.data_module.DistillDataModule

# Applied to every image_corpus entry (train / val / test alike), so all of them agree on the split.
# Splits are a seeded hash of each image's fingerprint: duplicates share a split, the lite corpus is a
# consistent subset of the full one, and changing them needs no rebuild.
dataset_defaults:
  image_corpus: {val_fraction: "${corpus_split.val_fraction}", test_fraction: "${corpus_split.test_fraction}", split_seed: "${corpus_split.split_seed}", require_finalized: true}

mixture:                 # sampling probability per component (sums to 1; renormalised if not)
  cc12m: 0.33            # web, open-vocabulary                       ~10.9M
  objects: 0.12          # object-centric: ${objects_source} (ImageNet-1k 1.28M, default; ImageNet-21k 13.7M)
  openimages: 0.10       # multi-object scenes (box-annotated subset)   ~1.7M
  sa1b: 0.08             # high-resolution dense scenes                 ~1.1M
  pixmo_docs: 0.06       # text-rich: charts / tables / diagrams        ~0.26M
  synthdog_en: 0.03      # text-rich: synthetic documents               ~0.5M
  cauldron: 0.08         # text-rich: docs / charts / scene text / UI   ~0.4M
  ego4d: 0.14            # egocentric video frames                      ~1.5M
  epic_kitchens: 0.03    # egocentric kitchen frames                    ~0.15M
  target: 0.03           # benchmark TRAIN splits (VizWiz, TextVQA, EgoBlind) ~45K
drop_groups: []

train:
  - {name: image_corpus, root: "${corpus_root}/cc12m", group: web, weight: "${data_module.mixture.cc12m}"}
  - {name: image_corpus, root: "${corpus_root}/${objects_source}", group: objects, weight: "${data_module.mixture.objects}"}
  - {name: image_corpus, root: "${corpus_root}/openimages", group: scenes, weight: "${data_module.mixture.openimages}"}
  - {name: image_corpus, root: "${corpus_root}/sa1b", group: scenes, weight: "${data_module.mixture.sa1b}"}
  - {name: image_corpus, root: "${corpus_root}/text_rich/pixmo_docs", group: text_rich, weight: "${data_module.mixture.pixmo_docs}"}
  - {name: image_corpus, root: "${corpus_root}/text_rich/synthdog_en", group: text_rich, weight: "${data_module.mixture.synthdog_en}"}
  - {name: image_corpus, root: "${corpus_root}/text_rich/cauldron/*", group: text_rich, weight: "${data_module.mixture.cauldron}"}
  - {name: image_corpus, root: "${corpus_root}/egocentric/ego4d", group: egocentric, weight: "${data_module.mixture.ego4d}"}
  - {name: image_corpus, root: "${corpus_root}/egocentric/epic_kitchens", group: egocentric, weight: "${data_module.mixture.epic_kitchens}"}
  - {name: target_train, data_root: "${data_root}", group: target, weight: "${data_module.mixture.target}"}

# Model selection (selection_metric = val/fid_lm_cos, image-weighted over all groups and budgets) and per-group monitoring
# (val/<group>/token_cos, ...). `limit` keeps an evenly spaced subset of each source's val split.
val:
  - {name: image_corpus, split: val, limit: 1000, group: web, root: "${corpus_root}/cc12m"}
  - {name: image_corpus, split: val, limit: 1000, group: objects, root: "${corpus_root}/${objects_source}"}
  - {name: image_corpus, split: val, limit: 500, group: scenes, root: "${corpus_root}/openimages"}
  - {name: image_corpus, split: val, limit: 500, group: scenes, root: "${corpus_root}/sa1b"}
  - {name: image_corpus, split: val, limit: 1000, group: text_rich, root: ["${corpus_root}/text_rich/pixmo_docs", "${corpus_root}/text_rich/synthdog_en", "${corpus_root}/text_rich/cauldron/*"]}
  - {name: image_corpus, split: val, limit: 1000, group: egocentric, root: ["${corpus_root}/egocentric/ego4d", "${corpus_root}/egocentric/epic_kitchens"]}
  - {name: lmdb_vqa, path: "${data_root}/vizwiz", split: val, mode: image, limit: 1000, group: target}   # official VizWiz val

# Reported once after training with the best checkpoint (run_distill.py final_test); never used for selection.
test:
  - {name: image_corpus, split: test, limit: 5000, group: web, root: "${corpus_root}/cc12m"}
  - {name: image_corpus, split: test, limit: 5000, group: objects, root: "${corpus_root}/${objects_source}"}
  - {name: image_corpus, split: test, limit: 5000, group: scenes, root: ["${corpus_root}/openimages", "${corpus_root}/sa1b"]}
  - {name: image_corpus, split: test, limit: 5000, group: text_rich, root: ["${corpus_root}/text_rich/pixmo_docs", "${corpus_root}/text_rich/synthdog_en", "${corpus_root}/text_rich/cauldron/*"]}
  - {name: image_corpus, split: test, limit: 5000, group: egocentric, root: ["${corpus_root}/egocentric/ego4d", "${corpus_root}/egocentric/epic_kitchens"]}

# Batching protocol (docs/protocol.md): one budget + one processor shape per batch, ~tokens_per_batch
# soft tokens per batch, no padding; every budget and aspect ratio of the input domain is trained.
input_domain: ${input_domain}
sampling:
  mode: crop                                   # random crops onto the batch's aspect / shape
  budgets: ${train_budgets}
  budget_weights: ${train_budget_weights}      # share of batches (= compute) per budget
  tokens_per_batch: ${tokens_per_batch}
  camera_aspects: [1.3333, 0.75, 1.7778, 0.5625]   # 4:3 / 16:9 glasses cameras, both orientations
  camera_prob: 0.5                             # else log-uniform aspect in [1/max_aspect, max_aspect]
evaluation: {val_budgets: "${val_budgets}", test_budgets: "${test_budgets}", tokens_per_batch: "${tokens_per_batch}", filter_domain: true}
samples_per_epoch: 2000000
collator: {train: true, crop_scale: [0.35, 1.0], hflip_prob: 0.0}   # crop area relative to the largest crop of the batch aspect
val_collator: {train: false}                                         # full images, bit-exact processor geometry
num_workers: ${num_workers}
seed: ${seed}
