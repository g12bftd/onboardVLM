# @package _global_
# python -u run_distill.py +experiment=stage1/timm_mobileclip2_mci2_e2b
experiment_name: stage1_timm_mobileclip2_mci2_e2b
token_budgets: [140, 280, 560]   # multi-budget training; the student is budget-agnostic
batch_size: 32
layer_map: {2: 7, 3: 15}   # student layer/stage -> Gemma 4 vision layer (0..15); stages 2/3 = stride 24/48
defaults:
  - override /teacher: gemma4_e2b
  - override /student: timm_mobileclip2_mci2
  - override /criterion: stage1_full_lm
  - override /data_module: stage1_general
trainer:
  max_epochs: 30
