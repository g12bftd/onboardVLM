# @package _global_
# Which training budgets are needed? Every run is evaluated on ALL budgets of the input domain, so a
# single-budget student exposes the generalisation gap:  python -u run_distill.py -m +experiment=sweeps/token_budget
experiment_name: sweep_budget_${join:${train_budgets}}
defaults:
  - override /teacher: gemma4_e2b
  - override /student: gemma4_vit_l8_d384
  - override /data_module: general_vision_lite
hydra:
  sweeper:
    params:
      train_budgets: "[70],[280],[1120],[140,280,560],[70,140,280,560,1120]"
