[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onboard-vlm"
version = "0.1.0"
description = "Toward fully onboard vision-language models for smart glasses: distilling Gemma 4 vision encoders into edge students."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=5.4",
    "timm>=1.0.15",
    "safetensors>=0.4",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pytorch-lightning>=2.4",
    "lmdb>=1.4",
    "pillow>=10",
    "numpy",
    "requests",
    "huggingface_hub>=0.30",
]

[project.optional-dependencies]
data = ["datasets>=3.0", "av>=12", "gdown>=5", "kaggle"]
dev = ["pytest>=8", "scikit-learn"]

[tool.setuptools.packages.find]
include = ["onboard_vlm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 140
