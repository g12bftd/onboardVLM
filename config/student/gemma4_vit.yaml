# A smaller Gemma 4 vision encoder: the original transformers `Gemma4VisionModel` built from a smaller
# Gemma4VisionConfig (fresh initialisation). Teacher reference: 16 layers, hidden 768, 12 heads x 64,
# MLP 3072, 10240 positions/axis. Override anything, e.g. student.num_hidden_layers=6 student.hidden_size=512
name: gemma4_vit
out_dim: ${deploy_vision_dim}      # 768: tokens feed the original E2B/E4B embed_vision unchanged
hidden_size: 384
num_hidden_layers: 8
num_attention_heads: null          # null -> hidden_size / head_dim
head_dim: 64
intermediate_size: null            # null -> 4 x hidden_size
position_embedding_size: 256       # positions per axis (256 x 16 px = 4096 px per side)
use_clipped_linears: false
rms_norm_eps: 1.0e-6
rope_theta: 100.0
attention_dropout: 0.0
attn_implementation: sdpa
grad_checkpointing: false
