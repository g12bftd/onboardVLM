# Teacher-generated responses for logit distillation (run_generate_targets.py).
# The prompted images come from the TRAIN split of the corpus (the same split definition as training:
# keep corpus_split identical to config/defaults.yaml - tests/test_configs.py checks it) and from the
# benchmark train questions. Validation responses: split_name=val 'sources=${val_sources}'.
data_root: ${oc.env:ONBOARD_VLM_DATA,./data/lmdb}
corpus_root: ${oc.env:ONBOARD_VLM_CORPUS,./data/corpus}
output_root: ${oc.env:ONBOARD_VLM_OUT,./outputs}
corpus_split: {val_fraction: 0.002, test_fraction: 0.002, split_seed: 0}
objects_source: imagenet1k   # = config/defaults.yaml
dataset_defaults:
  image_corpus: ${corpus_split}

split_name: train
output_dir: ${output_root}/teacher_responses/${teacher.key}_${split_name}
budget: 280                 # images are shown to the teacher at the default image budget
max_new_tokens: 256
skip_empty: true          # drop empty responses (counted in the provenance file)
dtype: bfloat16
device: cuda
batch_size: 16
num_workers: 8
num_shards: 1
shard_id: 0
seed: 0

templates:                  # image-agnostic prompts (onboard_vlm/data/teacher_targets.py); one per image
  caption_detailed: "Describe this image in detail."
  caption_short: "Describe this image in one sentence."
  ocr: "Read out all the text visible in this image. If there is no text, say that there is none."
  spatial: "List the main objects in this image and describe where they are relative to each other."
  reasoning: "What is notable or unusual in this image, and why?"
  salient: "What is the main subject of this image, and what is happening?"

sources:                    # ~150k prompts over every corpus group (general-purpose; no benchmark data)
  - {dataset: {name: image_corpus, root: "${corpus_root}/cc12m", split: train, limit: 40000}}
  - {dataset: {name: image_corpus, root: "${corpus_root}/${objects_source}", split: train, limit: 30000}}
  - {dataset: {name: image_corpus, root: ["${corpus_root}/openimages", "${corpus_root}/sa1b"], split: train, limit: 40000}}
  - {dataset: {name: image_corpus, root: ["${corpus_root}/text_rich/pixmo_docs", "${corpus_root}/text_rich/synthdog_en", "${corpus_root}/text_rich/cauldron/*"], split: train, limit: 40000}}
val_sources:                # held-out images (corpus val split) for the validation KL
  - {dataset: {name: image_corpus, root: ["${corpus_root}/cc12m", "${corpus_root}/${objects_source}", "${corpus_root}/openimages"], split: val, limit: 1000}}
  - {dataset: {name: image_corpus, root: ["${corpus_root}/text_rich/pixmo_docs", "${corpus_root}/text_rich/cauldron/*"], split: val, limit: 500}}

defaults:
  - _self_
  - teacher: gemma4_e2b

hydra:
  run:
    dir: ${output_root}/hydra/generate_targets/${split_name}_${shard_id}
