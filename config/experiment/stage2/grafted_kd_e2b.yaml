# @package _global_
# python -u run_distill.py +experiment=stage2/grafted_kd_e2b stage1_experiment=<a Stage-1 experiment_name>
# Only the grafted student encoder is trained; the Gemma 4 VLM (embed_vision + LM) stays byte-identical.
experiment_name: stage2_${stage1_experiment}
stage1_experiment: stage1_gemma4_vit_l8_d384_e2b   # student export to graft
batch_size: 8
defaults:
  - override /teacher: gemma4_e2b
  - override /criterion: stage2_logit_kd
  - override /data_module: stage2_vqa
  - override /task: stage2
trainer:
  max_epochs: 3
