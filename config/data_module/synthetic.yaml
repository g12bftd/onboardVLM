# Offline dry run: random images, no downloads.
_target_: onboard_vlm.data.data_module.DistillDataModule
train:
  - {name: synthetic, num_samples: 64, min_side: 96, max_side: 640}
val:                      # two groups -> per-group metrics val/a/..., val/b/... + overall val/...
  - {name: synthetic, num_samples: 12, seed: 1, group: a}
  - {name: synthetic, num_samples: 8, seed: 2, group: b}
test:
  - {name: synthetic, num_samples: 8, seed: 3, group: a}
input_domain: ${input_domain}
sampling: {mode: crop, budgets: "${train_budgets}", tokens_per_batch: "${tokens_per_batch}"}
evaluation: {val_budgets: "${val_budgets}", test_budgets: "${test_budgets}", tokens_per_batch: "${tokens_per_batch}"}
samples_per_epoch: 64
collator: {train: true}
val_collator: {train: false}
num_workers: 0
pin_memory: false
seed: ${seed}
