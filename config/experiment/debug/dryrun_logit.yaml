# @package _global_
# Fully offline sanity check of logit_distillation: python run_distill.py +experiment=debug/dryrun_logit
experiment_name: dryrun_logit
deploy_vision_dim: 48
input_domain: {budgets: [70, 140], max_aspect: 4.0}   # small budgets keep the CPU dry run fast
tokens_per_batch: 280                                 # 4 images at 70 tokens, 2 at 140
val_budgets: [70, 140]
test_budgets: [70]
student_dir: null
task:
  dtype: float32
  gradient_checkpointing: false
defaults:
  - override /task: logit_distillation
  - override /criterion: logit_kd
  - override /teacher: gemma4_tiny
  - override /student: debug_tiny
  - override /data_module: synthetic_vqa
  - override /trainer: cpu_debug
callbacks:
  progress_bar: {refresh_rate: 1}
  pipeline_logger: {every_n_steps: 1}
